[project]
name = "web-to-pdf-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "boto3>=1.43.54",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "playwright>=1.61.0",
    "posthog>=7.28.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "resend>=2.34.0",
    "sentry-sdk>=2.66.1",
    "sqlalchemy>=2.0.51",
    "stripe>=15.3.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "boto3-stubs[s3]>=1.43.54",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["apps/api/src"]
extend-exclude = [".venv", "apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api/src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["playwright.*", "posthog.*", "resend.*", "stripe.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
addopts = "-q"
